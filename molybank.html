<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moly Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e8ef;--ink:#2d3748;--mut:#7b8798;--hi:#ffffff;--lo:#bcc4d1;--in:#1f9d6b;--out:#d6454a;
--up:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sm:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--dn:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262b33;--ink:#e6ebf2;--mut:#8f9aab;--hi:#30363f;--lo:#1b1f25;--in:#4cd39b;--out:#ff7a7e}}
:root[data-theme="dark"]{--bg:#262b33;--ink:#e6ebf2;--mut:#8f9aab;--hi:#30363f;--lo:#1b1f25;--in:#4cd39b;--out:#ff7a7e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 6px}
h1{margin:0;font-size:22px;font-weight:800}
.saldo{color:var(--mut);font-size:13px;margin-top:3px;font-weight:600}
.tabs{display:flex;gap:14px;margin:12px 22px;padding:6px;border-radius:18px;box-shadow:var(--dn)}
.tabs.sub{margin:4px 0 14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:700 14px inherit;font-family:inherit;padding:11px;border-radius:14px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink);box-shadow:var(--sm)}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:10px 22px 28px;min-width:0}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.t{border-radius:20px;padding:16px 14px;box-shadow:var(--up)}
.t small{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.t b{display:block;font-size:18px;font-weight:800;margin-top:8px;word-break:break-word}
.t.in b{color:var(--in)}.t.out b{color:var(--out)}
.box{border-radius:24px;padding:20px;margin-top:22px;box-shadow:var(--up)}
.box h2{margin:0 0 14px;font-size:15px}
.seg{display:flex;gap:14px;margin-bottom:6px}
.seg button{flex:1;padding:12px;border:0;border-radius:14px;background:var(--bg);color:var(--mut);font:700 14px inherit;font-family:inherit;cursor:pointer;box-shadow:var(--sm)}
.seg button.on{box-shadow:var(--dn)}
.seg button.in.on{color:var(--in)}.seg button.out.on{color:var(--out)}
.seg button.in{box-shadow:var(--sm),0 0 12px color-mix(in srgb,var(--in) 32%,transparent)}
.seg button.out{box-shadow:var(--sm),0 0 12px color-mix(in srgb,var(--out) 32%,transparent)}
.seg button.in.on{box-shadow:var(--dn),0 0 18px color-mix(in srgb,var(--in) 45%,transparent)}
.seg button.out.on{box-shadow:var(--dn),0 0 18px color-mix(in srgb,var(--out) 45%,transparent)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 8px}
input{width:100%;padding:14px;border:0;border-radius:14px;background:var(--bg);color:var(--ink);font:600 15px inherit;font-family:inherit;box-shadow:var(--dn)}
input::placeholder{color:var(--mut)}
input:focus-visible,button:focus-visible{outline:2px solid var(--in);outline-offset:3px}
.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:16px;background:var(--bg);color:var(--ink);font:800 15px inherit;font-family:inherit;cursor:pointer;box-shadow:var(--up)}
.save:active{box-shadow:var(--dn)}
.err{color:var(--out);font-size:12px;min-height:16px;margin-top:10px;font-weight:600}
.inner{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;margin:0 -22px;min-height:0}
.inner::-webkit-scrollbar{display:none}
.sub1{flex:0 0 100%;scroll-snap-align:start;padding:6px 32px 12px;min-width:0}
.sum{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin:0 2px 14px}
.sum.in{color:var(--in)}.sum.out{color:var(--out)}
.row{display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 12px;margin-bottom:13px;font-weight:700;font-size:13px;box-shadow:var(--sm)}
.row .k{flex:1;min-width:0;overflow-wrap:anywhere}
.row .s{color:var(--mut)}
.row .n{font-weight:800;white-space:nowrap}
.row button{border:0;background:var(--bg);color:var(--mut);font-size:15px;width:26px;height:26px;flex:none;border-radius:50%;cursor:pointer;box-shadow:var(--sm)}
.empty{color:var(--mut);font-size:13px;padding:6px 2px;font-weight:600}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.dt>div{min-width:0}
.dt input{min-width:0;height:48px;padding:0 14px;font-size:14px;line-height:48px;text-align:left;color-scheme:light dark;-webkit-appearance:none;appearance:none}
.dt input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
.row .w{display:block;font-size:10px;color:var(--mut);font-weight:600;margin-top:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);width:min(92%,520px);z-index:20;padding:16px 18px;border-radius:18px;background:var(--bg);color:var(--out);font:800 15px 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center;box-shadow:var(--up);cursor:pointer}
.toast[hidden]{display:none}
.tabs button .ic{vertical-align:-3px;margin-right:6px}
.tabs button.ti .ic{color:var(--in)}
.tabs button.to .ic{color:var(--out)}
.mon{display:flex;align-items:center;justify-content:space-between;margin:0 2px 16px;font-weight:800;font-size:14px}
.mon button{border:0;background:var(--bg);color:var(--ink);font-size:18px;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer;box-shadow:var(--sm)}
.mon button:active{box-shadow:var(--dn)}
.rs{margin-top:22px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--mut)}
.rs button{border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:12px;font-family:inherit;padding:10px 16px;border-radius:12px;box-shadow:var(--sm);cursor:pointer}
.rs button.dg{color:var(--out)}
.rs button:active{box-shadow:var(--dn)}
.rs span{flex:0 0 100%;text-align:center}
.rs button{flex:1 1 0;max-width:150px;text-align:center}
.tabs.sub{box-shadow:none;justify-content:center;gap:30px;padding:6px 0;margin:4px 0 18px}
.tabs.sub button{flex:none;width:58px;height:58px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--sm)}
.tabs.sub button.on{box-shadow:var(--dn)}
.tabs.sub .ic{width:24px;height:24px;margin:0;vertical-align:baseline}
.wallet{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;color:var(--ink);background:var(--bg);box-shadow:var(--up)}

.wallet>*{position:relative}
.wl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--mut)}
#eye{border:0;background:var(--bg);color:var(--mut);width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sm)}
#eye:active{box-shadow:var(--dn)}
#eye svg{width:15px;height:15px}
#eye:focus-visible{outline:2px solid var(--in);outline-offset:3px}
.wb{font-size:30px;font-weight:800;margin:8px 0 18px;word-break:break-word}
.wallet .tot{gap:12px}
.pill{min-width:0;border-radius:18px;padding:12px;background:var(--bg);box-shadow:var(--dn)}
.pill:nth-child(1) svg,.pill:nth-child(1) b{color:var(--in)}
.pill:nth-child(2) svg,.pill:nth-child(2) b{color:var(--out)}
.pill small{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mut)}
.pill b{display:block;font-size:15px;font-weight:800;margin-top:6px;word-break:break-word}
#theme{flex:none;position:relative;width:58px;height:30px;padding:0;border:0;border-radius:999px;cursor:pointer;background:color-mix(in srgb,var(--lo) 22%,var(--bg));box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi),2px 2px 6px var(--lo),-2px -2px 6px var(--hi)}
#theme .kn{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 6px var(--lo),-2px -2px 5px var(--hi);transition:transform .25s ease}
#theme[aria-checked="true"] .kn{transform:translateX(28px)}
#theme:focus-visible{outline:2px solid var(--in);outline-offset:3px}
#theme .kn{display:grid;place-items:center}
#theme .kn svg{grid-area:1/1;width:14px;height:14px}
#theme .sun{color:#e69a2e}
#theme .moon{display:none;color:#7aa2ff}
#theme[aria-checked="true"] .sun{display:none}
#theme[aria-checked="true"] .moon{display:block}
:root[data-theme="dark"] .dt input{color-scheme:dark}
:root[data-theme="light"] .dt input{color-scheme:light}
@media (prefers-reduced-motion:reduce){#theme .kn{transition:none}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
input{font-size:16px;font-weight:600;font-family:inherit}
.dt input{font-size:16px}
@media (orientation:landscape) and (min-width:640px){
body{max-width:900px}
.slides>.slide:first-child{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.slides>.slide:first-child .box{margin-top:0}
}

<script>
(function(){
var KEY='keuangan-v1',type='in',data={in:[],out:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.in&&p.out)data=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function rp(n){return n.toLocaleString('id-ID');}
function sum(a){return a.reduce(function(s,x){return s+x.n;},0);}
var $=function(id){return document.getElementById(id);};
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function list(k){
  var el=$('l'+k);
  if(!data[k].some(inMon)){el.innerHTML='<div class="empty">Belum ada catatan di bulan ini.</div>';return;}
  el.innerHTML=data[k].map(function(x,i){if(!inMon(x))return '';
    return '<div class="row"><span class="k">'+esc(x.k)+' <span class="s">|</span>'+when(x)+'</span><span class="n">'+rp(x.n)+'</span><button data-k="'+k+'" data-i="'+i+'" aria-label="Hapus '+esc(x.k)+'">×</button></div>';
  }).join('');
}
function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function nowFill(){var t=new Date();$('tgl').value=todayStr();$('jam').value=pad(t.getHours())+':'+pad(t.getMinutes());}
var BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function when(x){if(!x.d)return '';var p=x.d.split('-');return '<small class="w">'+(+p[2])+' '+BL[+p[1]-1]+' '+p[0]+', '+(x.tm||'')+'</small>';}
var tt;function toast(m){var el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},6000);}
var th=null;try{th=localStorage.getItem('keuangan-theme');}catch(e){}
function isDark(){return th?th==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(){var d=isDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');$('theme').setAttribute('aria-checked',d?'true':'false');}
var bal=0,hide=false;try{hide=localStorage.getItem('keuangan-hide')==='1';}catch(e){}
var EON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function showBal(){$('saldo').textContent=hide?'Rp ••••••':'Rp '+rp(bal);var e=$('eye');e.setAttribute('aria-pressed',hide?'true':'false');e.setAttribute('aria-label',hide?'Tampilkan saldo':'Sembunyikan saldo');e.innerHTML=hide?EOFF:EON;}
var mon='',asking={in:false,out:false};
var BF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function inMon(x){return (x.d||'').slice(0,7)===mon;}
function monLabel(){var p=mon.split('-');return BF[+p[1]-1]+' '+p[0];}
function shiftMon(d){var p=mon.split('-'),t=new Date(+p[0],+p[1]-1+d,1);mon=t.getFullYear()+'-'+pad(t.getMonth()+1);render();}
function rsRender(){['in','out'].forEach(function(k){
  var nm=k==='in'?'pemasukan':'pengeluaran';
  $('rs'+k).innerHTML=asking[k]?'<span>Hapus semua riwayat '+nm+'?</span><button class="dg" data-a="yes">Ya, hapus</button><button data-a="no">Batal</button>':'<button data-a="ask">Reset '+(k==='in'?'Pemasukan':'Pengeluaran')+'</button>';
});}
function render(){
  var a=sum(data.in),b=sum(data.out);
  $('tin').textContent='Rp '+rp(a);$('tout').textContent='Rp '+rp(b);
  bal=a-b;showBal();
  $('sin').textContent='Rp '+rp(sum(data.in.filter(inMon)));$('sout').textContent='Rp '+rp(sum(data.out.filter(inMon)));var ml=monLabel();document.querySelectorAll('.ml').forEach(function(e){e.textContent=ml;});rsRender();
  list('in');list('out');
}
function pager(box,tabsEl){
  var tabs=tabsEl.querySelectorAll('button');
  function go(i){box.scrollTo({left:i*box.clientWidth,behavior:'smooth'});}
  tabs.forEach(function(t){t.onclick=function(){go(+t.dataset.i);};});
  box.addEventListener('scroll',function(){
    var i=Math.round(box.scrollLeft/box.clientWidth);
    tabs.forEach(function(t,j){t.classList.toggle('on',j===i);});
  });
  return go;
}
var goTop=pager($('slides'),$('top')),goSub=pager($('inner'),$('subtabs'));
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){
  type=b.dataset.t;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b);});
};});
$('nom').addEventListener('input',function(e){
  var d=e.target.value.replace(/\D/g,'');e.target.value=d?rp(parseInt(d,10)):'';
});
$('save').onclick=function(){
  var k=$('ket').value.trim(),n=parseInt($('nom').value.replace(/\D/g,''),10);
  if(!k){$('err').textContent='Isi keterangan dulu.';return;}
  if(!n){$('err').textContent='Isi nominal lebih dari 0.';return;}
  var d=$('tgl').value||todayStr(),tm=$('jam').value||'00:00';
  data[type].push({k:k,n:n,d:d,tm:tm});mon=d.slice(0,7);
  data[type].sort(function(a,b){return ((b.d||'')+(b.tm||'')).localeCompare((a.d||'')+(a.tm||''));});
  save();render();
  $('ket').value='';$('nom').value='';$('err').textContent='';nowFill();
  goSub(type==='in'?0:1);goTop(1);
  if(type==='out'){var tot=data.out.filter(function(x){return x.d===d;}).reduce(function(s,x){return s+x.n;},0);if(tot>300000)toast('Anda Terlalu Boros Njirr !!');}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('.row button');if(!b)return;
  data[b.dataset.k].splice(+b.dataset.i,1);save();render();
});
$('toast').onclick=function(){this.hidden=true;};
document.addEventListener('click',function(e){
  if(e.target.closest('#theme')){th=isDark()?'light':'dark';try{localStorage.setItem('keuangan-theme',th);}catch(x){}applyTheme();return;}
  if(e.target.closest('#eye')){hide=!hide;try{localStorage.setItem('keuangan-hide',hide?'1':'0');}catch(x){}showBal();return;}
  var m=e.target.closest('.pm');if(m){shiftMon(+m.dataset.d);return;}
  var a=e.target.closest('.rs button');if(!a)return;
  var k=a.parentNode.dataset.k,act=a.dataset.a;
  if(act==='ask')asking[k]=true;
  else if(act==='no')asking[k]=false;
  else if(act==='yes'){data[k]=[];asking[k]=false;save();}
  render();
});
['in','out'].forEach(function(k){data[k].forEach(function(x){if(!x.d)x.d=todayStr();});});
mon=todayStr().slice(0,7);
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
applyTheme();nowFill();render();
})();
</script>
</body>
</html>
